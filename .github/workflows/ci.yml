name: SOC Lab Lint & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-assets:
    name: Validate Markdown & XML Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify SVG Files
        run: |
          echo "Checking SVGs..."
          test -f assets/animations/banner-animated.svg
          test -f assets/animations/architecture-flow.svg
          test -f assets/animations/threat-response-loop.svg
          test -f assets/animations/terminal-simulation.svg
          echo "All animated SVGs exist!"

      - name: Verify Configuration Files
        run: |
          echo "Checking configuration files..."
          test -f configs/ossec.conf
          test -f configs/rules/local_rules.xml
          test -f configs/shuffle/soc_automated_response_workflow.json
          echo "All configuration files exist and are intact!"
