<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="480" style="background:#090d16; border-radius:12px; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="wazuh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="shuffle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="tailscale-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="ar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <style>
    .pulse-node { animation: pulse 2.5s infinite ease-in-out; }
    .packet-cyan { fill: #06b6d4; filter: drop-shadow(0 0 6px #06b6d4); }
    .packet-purple { fill: #c084fc; filter: drop-shadow(0 0 6px #c084fc); }
    .packet-green { fill: #10b981; filter: drop-shadow(0 0 6px #10b981); }
    .packet-red { fill: #ef4444; filter: drop-shadow(0 0 6px #ef4444); }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.98); } }
  </style>

  <!-- Background -->
  <rect width="940" height="480" fill="url(#flow-bg)" rx="12" />
  <rect width="940" height="480" fill="url(#arch-grid)" rx="12" />
  <rect x="8" y="8" width="924" height="464" rx="10" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Section Titles -->
  <text x="35" y="42" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">DISTRIBUTED ENDPOINTS</text>
  <text x="240" y="42" fill="#06b6d4" font-size="13" font-weight="700" letter-spacing="1">TAILSCALE MESH</text>
  <text x="400" y="42" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">WAZUH SIEM</text>
  <text x="595" y="42" fill="#c084fc" font-size="13" font-weight="700" letter-spacing="1">SHUFFLE SOAR</text>
  <text x="770" y="42" fill="#f87171" font-size="13" font-weight="700" letter-spacing="1">ACTIVE RESPONSE</text>

  <!-- Flow Connector Lines -->
  <path id="path-ep1-ts" d="M 175 105 L 255 105 L 255 240" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path id="path-ep2-ts" d="M 175 225 L 255 225 L 255 240" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <path id="path-ep3-ts" d="M 175 345 L 255 345 L 255 240" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <path id="path-ts-wazuh" d="M 285 240 L 375 240" fill="none" stroke="#0284c7" stroke-width="2" />
  <path id="path-wazuh-soar" d="M 515 240 L 575 240" fill="none" stroke="#9333ea" stroke-width="2" />
  
  <path id="path-soar-vt" d="M 695 210 L 760 140" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3" />
  <path id="path-soar-ar" d="M 695 270 L 760 340" fill="none" stroke="#ef4444" stroke-width="2" />
  
  <path id="path-ar-feedback" d="M 850 380 L 850 435 L 105 435 L 105 385" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6" />

  <!-- Animated Data Packets -->
  <!-- Endpoint to Wazuh Packets -->
  <circle r="4" class="packet-cyan">
    <animateMotion repeatCount="indefinite" dur="2.8s" path="M 175 105 L 255 105 L 255 240 L 375 240" />
  </circle>
  <circle r="4" class="packet-cyan">
    <animateMotion repeatCount="indefinite" dur="2.4s" begin="0.8s" path="M 175 225 L 255 225 L 375 240" />
  </circle>
  <circle r="4" class="packet-cyan">
    <animateMotion repeatCount="indefinite" dur="3s" begin="1.4s" path="M 175 345 L 255 345 L 255 240 L 375 240" />
  </circle>

  <!-- Wazuh to SOAR Webhook Packet -->
  <circle r="5" class="packet-purple">
    <animateMotion repeatCount="indefinite" dur="1.8s" begin="0.5s" path="M 515 240 L 575 240" />
  </circle>

  <!-- SOAR to Containment Packet -->
  <circle r="5" class="packet-red">
    <animateMotion repeatCount="indefinite" dur="2s" begin="1s" path="M 695 270 L 760 340" />
  </circle>

  <!-- Containment Feedback Loop Packet -->
  <circle r="4" class="packet-red">
    <animateMotion repeatCount="indefinite" dur="4.5s" begin="1.8s" path="M 850 380 L 850 435 L 105 435 L 105 385" />
  </circle>

  <!-- 1. DISTRIBUTED ENDPOINTS (Left Column) -->
  <!-- Endpoint 1: Ubuntu -->
  <g transform="translate(30, 65)">
    <rect width="145" height="80" rx="8" fill="url(#card-blue)" stroke="#334155" stroke-width="1" />
    <rect width="4" height="80" fill="#f97316" rx="2" />
    <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">Ubuntu 24.04</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Victim: M. Massoud</text>
    <text x="14" y="58" fill="#f97316" font-size="10" font-weight="600">SSH Hydra Brute-Force</text>
    <text x="14" y="72" fill="#64748b" font-size="9.5">Agent: 100.x.x.11</text>
  </g>

  <!-- Endpoint 2: Windows 11 -->
  <g transform="translate(30, 185)">
    <rect width="145" height="80" rx="8" fill="url(#card-blue)" stroke="#334155" stroke-width="1" />
    <rect width="4" height="80" fill="#06b6d4" rx="2" />
    <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">Windows 11</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Victim: Karim</text>
    <text x="14" y="58" fill="#06b6d4" font-size="10" font-weight="600">PowerShell IEX / Bypass</text>
    <text x="14" y="72" fill="#64748b" font-size="9.5">Agent: 100.x.x.12</text>
  </g>

  <!-- Endpoint 3: Windows Server 2022 -->
  <g transform="translate(30, 305)">
    <rect width="145" height="80" rx="8" fill="url(#card-blue)" stroke="#334155" stroke-width="1" />
    <rect width="4" height="80" fill="#a855f7" rx="2" />
    <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">Windows Server '22</text>
    <text x="14" y="42" fill="#94a3b8" font-size="10.5">Target: M. Bushnak</text>
    <text x="14" y="58" fill="#a855f7" font-size="10" font-weight="600">C2 / PsExec Service</text>
    <text x="14" y="72" fill="#64748b" font-size="9.5">Agent: 100.x.x.13</text>
  </g>

  <!-- 2. TAILSCALE MESH OVERLAY -->
  <g transform="translate(220, 195)">
    <rect width="70" height="90" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#neon-glow)" />
    <text x="35" y="32" fill="#06b6d4" font-size="20" text-anchor="middle">🌐</text>
    <text x="35" y="52" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Tailscale</text>
    <text x="35" y="66" fill="#38bdf8" font-size="9" text-anchor="middle">Mesh VPN</text>
    <text x="35" y="80" fill="#10b981" font-size="8.5" font-weight="600" text-anchor="middle">● 100.x Flat</text>
  </g>

  <!-- 3. WAZUH MANAGER (SIEM) -->
  <g transform="translate(375, 150)">
    <rect width="140" height="180" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <rect width="140" height="34" rx="10" fill="url(#wazuh-grad)" />
    <text x="70" y="22" fill="#ffffff" font-size="12.5" font-weight="800" text-anchor="middle">WAZUH SIEM v4.14</text>
    
    <text x="14" y="54" fill="#38bdf8" font-size="10.5" font-weight="700">Lead: Mohamed Sabry</text>
    <text x="14" y="74" fill="#94a3b8" font-size="9.5">✓ OVA VirtualBox Node</text>
    <text x="14" y="92" fill="#94a3b8" font-size="9.5">✓ Log Decoding Engine</text>
    <text x="14" y="110" fill="#94a3b8" font-size="9.5">✓ Correlation Rules:</text>
    <text x="22" y="126" fill="#f87171" font-size="8.5">· SSH Rules 5710-5763</text>
    <text x="22" y="140" fill="#fb923c" font-size="8.5">· PowerShell Rule 91837</text>
    <text x="22" y="154" fill="#c084fc" font-size="8.5">· C2 Service Rule 92650</text>
    <text x="14" y="172" fill="#10b981" font-size="9" font-weight="600">● Webhook Dispatcher</text>
  </g>

  <!-- 4. SHUFFLE SOAR ENGINE -->
  <g transform="translate(575, 160)">
    <rect width="120" height="160" rx="10" fill="#0f172a" stroke="#9333ea" stroke-width="1.5" />
    <rect width="120" height="32" rx="10" fill="url(#shuffle-grad)" />
    <text x="60" y="21" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">SHUFFLE SOAR</text>
    
    <text x="10" y="52" fill="#c084fc" font-size="10" font-weight="700">Eng: Omar Khaled</text>
    <text x="10" y="72" fill="#94a3b8" font-size="9">✓ Webhook Ingestion</text>
    <text x="10" y="88" fill="#94a3b8" font-size="9">✓ JSON Payload Parser</text>
    <text x="10" y="104" fill="#94a3b8" font-size="9">✓ Branch Decision Tree</text>
    <text x="10" y="120" fill="#94a3b8" font-size="9">✓ Wazuh JWT Auth</text>
    <text x="10" y="138" fill="#a855f7" font-size="8.5" font-weight="600">● Dual Pipeline Playbook</text>
  </g>

  <!-- 5. BRANCH A: VirusTotal API Enrichment -->
  <g transform="translate(760, 95)">
    <rect width="150" height="80" rx="8" fill="url(#card-blue)" stroke="#3b82f6" stroke-width="1" />
    <text x="14" y="24" fill="#60a5fa" font-size="11.5" font-weight="700">VirusTotal API v3</text>
    <text x="14" y="42" fill="#94a3b8" font-size="9.5">Threat Intel Enrichment</text>
    <text x="14" y="58" fill="#38bdf8" font-size="9">Hash / IP Reputation Query</text>
    <text x="14" y="72" fill="#10b981" font-size="8.5">Score Analysis &amp; Alert Feed</text>
  </g>

  <!-- 6. BRANCH B: Active Containment Actions -->
  <g transform="translate(760, 285)">
    <rect width="150" height="105" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <rect width="150" height="26" rx="8" fill="url(#ar-grad)" />
    <text x="75" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">ACTIVE CONTAINMENT</text>
    
    <text x="12" y="45" fill="#fca5a5" font-size="9.5" font-weight="700">Linux / Ubuntu:</text>
    <text x="18" y="59" fill="#94a3b8" font-size="8.5">firewall-drop (iptables drop)</text>
    <text x="12" y="77" fill="#fca5a5" font-size="9.5" font-weight="700">Windows / Server:</text>
    <text x="18" y="91" fill="#94a3b8" font-size="8.5">netsh advfirewall isolation</text>
  </g>

  <!-- Bottom Feedback Legend -->
  <g transform="translate(40, 448)">
    <text x="0" y="12" fill="#ef4444" font-size="10" font-weight="700">◄ AUTOMATED FEEDBACK &amp; CONTAINMENT LOOP</text>
    <text x="290" y="12" fill="#64748b" font-size="10">Real-time bi-directional execution pushes containment scripts back to the affected node within seconds.</text>
  </g>
</svg>
