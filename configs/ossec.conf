<!--
  Wazuh - Manager Configuration
  SOC Automation Lab: Wazuh SIEM + Shuffle SOAR + Tailscale Mesh
  Author: Mohamed Sabry (@0xsabry) & Team
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>127.0.0.1</smtp_server>
    <email_from>wazuh@soc-lab.local</email_from>
    <email_to>soc-team@soc-lab.local</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- Shuffle SOAR Webhook Integration -->
  <integration>
    <name>custom-shuffle</name>
    <hook_url>http://100.64.0.14:3001/api/v1/hooks/webhook_wazuh_alerts</hook_url>
    <level>6</level>
    <rule_id>5763,91837,92650,67027</rule_id>
    <alert_format>json</alert_format>
  </integration>

  <!-- Active Response Command Definitions -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>netsh-isolate</name>
    <executable>netsh.cmd</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Active Response Bindings -->
  <!-- 1. SSH Brute Force -> Linux iptables DROP -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5763</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- 2. Suspicious PowerShell / C2 Execution -> Windows Netsh Isolation -->
  <active-response>
    <command>netsh-isolate</command>
    <location>local</location>
    <rules_id>91837,67027</rules_id>
    <timeout>1800</timeout>
  </active-response>

  <!-- Agent Communication Settings (Tailscale Mesh IP Binding) -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
    <local_ip>100.64.0.10</local_ip>
  </remote>

  <!-- Auth Daemon for Agent Auto-Enrollment -->
  <auth>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge_removed_agents>yes</purge_removed_agents>
    <use_password>yes</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

</ossec_config>
